[package]
name = "niri-app-hotkey"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.53", features = ["derive"] }
directories = "6.0.0"
knus = "3.3.1"
miette = { version = "7.6.0", features = ["fancy"] }
niri-ipc = { path = "./niri-scratchpad-rs/niri-ipc" }
regex = "1.12.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
